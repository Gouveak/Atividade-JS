<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Array - Cadastro de Produtos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="barraNavegacao">
    <img src="caixa.jpg" class="logoBarra">
    <h2 class="tituloBarra">Cadastro de Produtos (Array de Objetos)</h2>
  </nav>

  <main class="containerPrincipal">
    <section class="painelCadastro">
      <h3>Cadastro de Produtos</h3>
      
      <div class="cadastro">
        <label for="nome">Produto:</label>
        <input id="nome" type="text" placeholder="Ex: Mouse" />
      </div>

      <div class="cadastro">
        <label for="preco">Preço (R$):</label>
        <input id="preco" type="number" step="0.01" placeholder="Ex: 99.90" />
      </div>

      <div class="cadastro">
        <label for="qtd">Quantidade:</label>
        <input id="qtd" type="number" step="1" placeholder="Ex: 2" />
      </div>
      
      <div class="botoes">
        <button id="btnAdicionar" class="botaoAdicionar">Adicionar produto</button>
        <button id="btnListar" class="botaoListar">Listar produtos</button>
        <button id="btnResumo" class="botaoResumo">Resumo</button>
        <button id="btnLimpar" class="botaoLimpar">Limpar tudo</button>
      </div>
    </section>
    <section class="painelListagem">
      <div id="tabela" class="tabelaContainer"></div>
      
      <div class="containerRemover">
        <h3>Remover por índice</h3>
        <input id="idxRemover" type="number" step="1" placeholder="Ex: 0" />
        <button id="btnRemover" class="botaoRemover">Remover</button>
      </div>
    </section>
    <section class="painelSaida">
      <div id="saida" class="saidaContainer"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
